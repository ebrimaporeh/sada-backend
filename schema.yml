openapi: 3.0.3
info:
  title: Dolelma API
  version: 1.0.0
  description: Crowdfunding for The Gambia
paths:
  /api/v1/analytics/campaign-status/:
    get:
      operationId: v1_analytics_campaign_status_retrieve
      description: Get campaign distribution by status
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/donations-by-day/:
    get:
      operationId: v1_analytics_donations_by_day_retrieve
      description: Get donations aggregated by day for chart
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/finance-summary/:
    get:
      operationId: v1_analytics_finance_summary_retrieve
      description: |-
        Get all figures for the admin Finances page, fully aggregated for a period.

        `period` is one of week|month|year|custom (default week). For `custom`,
        `start_date`/`end_date` (YYYY-MM-DD) are required.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/recent-donations/:
    get:
      operationId: v1_analytics_recent_donations_retrieve
      description: Get recent donations
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/stats/:
    get:
      operationId: v1_analytics_stats_retrieve
      description: Get aggregated dashboard stats for a date range
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/top-campaigns/:
    get:
      operationId: v1_analytics_top_campaigns_retrieve
      description: Get top campaigns by amount raised
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/top-donors/:
    get:
      operationId: v1_analytics_top_donors_retrieve
      description: Get top donors by total amount
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audit/admin/:
    get:
      operationId: v1_audit_admin_list
      summary: '[Admin] List audit log entries'
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: One of AuditLog.Action, e.g. campaign.created
      - in: query
        name: actor
        schema:
          type: string
        description: Filter by acting user id
      - in: query
        name: search
        schema:
          type: string
        description: Matches description, actor email, or target
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit/admin/actions/:
    get:
      operationId: v1_audit_admin_actions_retrieve
      description: |-
        Backs the admin Audit page's action filter dropdown -- one source of
        truth (AuditLog.Action) instead of a hand-copied list on the frontend.
      summary: '[Admin] List possible audit action types'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audit/admin/actors/:
    get:
      operationId: v1_audit_admin_actors_retrieve
      description: |-
        Backs the admin Activity page's "User" filter dropdown -- only
        users who've actually done something audited, not every user.
      summary: '[Admin] List users who appear as an actor in the audit log'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/google/:
    post:
      operationId: v1_auth_google_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleOAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleOAuth'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/google/link/:
    post:
      operationId: v1_auth_google_link_create
      description: |-
        Explicitly attach a Google account to the current (already logged-in)
        user, e.g. a 'Connect Google' button in account settings.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleOAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleOAuth'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: |-
        Shadows django_rest_passwordreset's own request-token endpoint at the
        same URL (see apps/authentication/urls.py) so an organization's recovery
        emails work here too, with zero change for individual accounts.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: An Api View which provides a method to reset a password based on
        a unique token
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordToken'
          description: ''
  /api/v1/auth/password-reset/validate_token/:
    post:
      operationId: v1_auth_password_reset_validate_token_create
      description: An Api View which provides a method to verify that a token is valid
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetToken'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/resend-verification/:
    post:
      operationId: v1_auth_resend_verification_create
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/set-password/:
    post:
      operationId: v1_auth_set_password_create
      description: |-
        For accounts with no usable password yet (Google-only signups) —
        see ChangePasswordView for accounts that already have one.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/:
    get:
      operationId: v1_campaigns_list
      summary: List public campaigns
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by category slug
      - in: query
        name: owner
        schema:
          type: string
        description: Filter by owner id (a campaigner's public profile)
      - in: query
        name: region
        schema:
          type: string
        description: Filter by region
      - in: query
        name: search
        schema:
          type: string
        description: Search term
      - in: query
        name: urgent
        schema:
          type: boolean
        description: Filter urgent only
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignList'
          description: ''
  /api/v1/campaigns/{slug}/:
    get:
      operationId: v1_campaigns_retrieve
      summary: Get campaign detail by slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
          description: ''
  /api/v1/campaigns/{slug}/report/:
    post:
      operationId: v1_campaigns_report_create
      summary: Report a campaign
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignReportCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignReportCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignReportCreate'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/{slug}/view/:
    post:
      operationId: v1_campaigns_view_create
      description: |-
        Explicit view-tracking beacon — fired by the frontend only when the
        public campaign detail page is actually shown, not by every fetch of
        campaign data (donate/donate-success pages reuse the same GET above
        without inflating the count).
      summary: Record a view of a campaign
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/{id}/:
    get:
      operationId: v1_campaigns_admin_retrieve
      summary: '[Admin] Get campaign detail by ID'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaign'
          description: ''
  /api/v1/campaigns/admin/{id}/action/{action}/:
    post:
      operationId: v1_campaigns_admin_action_create
      summary: '[Admin] Approve, reject, or suspend a campaign'
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/{id}/media/:
    post:
      operationId: v1_campaigns_admin_media_create
      summary: '[Admin] Upload cover and gallery images for any campaign'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/{id}/status-change/:
    post:
      operationId: v1_campaigns_admin_status_change_create
      summary: '[Admin] Change campaign status and send email notification'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              status:
                type: string
                description: New campaign status
              reason:
                type: string
                description: Reason for status change (optional)
          required:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/{id}/update/:
    patch:
      operationId: v1_campaigns_admin_update_partial_update
      summary: '[Admin] Update campaign details'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminCampaignUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminCampaignUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminCampaignUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/all/:
    get:
      operationId: v1_campaigns_admin_all_list
      summary: '[Admin] List all campaigns'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCampaignList'
          description: ''
  /api/v1/campaigns/admin/categories/:
    post:
      operationId: v1_campaigns_admin_categories_create
      summary: '[Admin] Create a new category'
      tags:
      - v1
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              name:
                type: string
              description:
                type: string
              icon:
                type: string
          required:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/campaigns/admin/reports/:
    get:
      operationId: v1_campaigns_admin_reports_list
      summary: '[Admin] List all campaign reports'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignReport'
          description: ''
  /api/v1/campaigns/admin/reports/{id}/update/:
    patch:
      operationId: v1_campaigns_admin_reports_update_partial_update
      summary: '[Admin] Update campaign report'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignReportUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCampaignReportUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaignReportUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/reports/campaigns/:
    get:
      operationId: v1_campaigns_admin_reports_campaigns_retrieve
      description: |-
        Backs the admin Reports table's "Campaign" filter dropdown -- only
        campaigns that actually have a report, not every campaign.
      summary: '[Admin] List campaigns that have at least one report'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/reports/stats/:
    get:
      operationId: v1_campaigns_admin_reports_stats_retrieve
      summary: '[Admin] Campaign report stats'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/admin/stats/:
    get:
      operationId: v1_campaigns_admin_stats_retrieve
      summary: '[Admin] Campaign stats'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/categories/:
    get:
      operationId: v1_campaigns_categories_list
      summary: List all active categories
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/campaigns/categories/{id}/:
    get:
      operationId: v1_campaigns_categories_retrieve
      summary: '[Admin] Get category detail'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: v1_campaigns_categories_partial_update
      summary: '[Admin] Update category details'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              name:
                type: string
              description:
                type: string
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_campaigns_categories_destroy
      summary: '[Admin] Delete a category'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/campaigns/categories/{id}/upload-image/:
    post:
      operationId: v1_campaigns_categories_upload_image_create
      summary: '[Admin] Upload category image'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/campaigns/create/:
    post:
      operationId: v1_campaigns_create_create
      summary: Create a new campaign
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
          description: ''
  /api/v1/campaigns/featured/:
    get:
      operationId: v1_campaigns_featured_list
      summary: Get up to 4 featured campaigns
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignList'
          description: ''
  /api/v1/campaigns/my/:
    get:
      operationId: v1_campaigns_my_list
      summary: List my campaigns
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignList'
          description: ''
