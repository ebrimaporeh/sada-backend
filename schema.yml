    VisionTopicDetail:
      type: object
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 300
        order:
          type: integer
        current_state:
          type: string
        implementation:
          type: string
        short_term_vision:
          type: string
        long_term_vision:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - slug
      - title
      - updated_at
    VisionTopicList:
      type: object
      description: |-
        Lean projection for the public index page -- title/summary/slug
        only, same reasoning as AdminCampaignListSerializer: don't serialize
        four markdown documents' worth of content for every topic just to
        render a list of teasers.
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 300
        order:
          type: integer
      required:
      - slug
      - title
    ZakatCalculationInput:
      type: object
      description: |-
        Assets/liabilities a donor enters — mirrors the classical zakatable
        wealth categories: cash and savings, gold/silver holdings, business
        trade goods, investments, money owed to them (receivables), minus
        debts they owe (liabilities are deducted before comparing to nisab).
      properties:
        cash_and_savings:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        gold_and_silver_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        business_assets:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        investments:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        money_owed_to_you:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        debts_you_owe:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
    ZakatSettings:
      type: object
      properties:
        nisab_gold_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        nisab_silver_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        gold_price_per_gram:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        silver_price_per_gram:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        zakat_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Percentage of zakatable wealth owed once it reaches nisab.
            Classically fixed at 2.5%.
        minimum_amount_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        nisab_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - nisab_amount
