components:
  schemas:
    AccountTypeEnum:
      enum:
      - individual
      - organization
      type: string
      description: |-
        * `individual` - Individual
        * `organization` - Organization
    ActionEnum:
      enum:
      - user.logged_in
      - user.registered
      - user.password_reset
      - user.profile_updated
      - user.role_changed
      - user.account_deleted
      - staff.created
      - campaign.created
      - campaign.updated
      - campaign.deleted
      - campaign.published
      - campaign.unpublished
      - campaign.rejected
      - report.status_changed
      - verification.approved
      - verification.rejected
      - donation.created
      - donation.status_changed
      - payment.refunded
      - payout.requested
      - payout.status_changed
      type: string
      description: |-
        * `user.logged_in` - Logged In
        * `user.registered` - Registered
        * `user.password_reset` - Reset Password
        * `user.profile_updated` - Updated Profile
        * `user.role_changed` - Changed User's Role
        * `user.account_deleted` - Deleted Account
        * `staff.created` - Created Staff Account
        * `campaign.created` - Created Campaign
        * `campaign.updated` - Updated Campaign
        * `campaign.deleted` - Deleted Campaign
        * `campaign.published` - Published Campaign
        * `campaign.unpublished` - Unpublished Campaign
        * `campaign.rejected` - Rejected Campaign
        * `report.status_changed` - Updated Report
        * `verification.approved` - Approved Verification
        * `verification.rejected` - Rejected Verification
        * `donation.created` - Created Donation
        * `donation.status_changed` - Donation Status Changed
        * `payment.refunded` - Refunded Payment
        * `payout.requested` - Requested Payout
        * `payout.status_changed` - Payout Status Changed
    AdminCampaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/Status598Enum'
        goal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        raised:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        donors_count:
          type: integer
        views_count:
          type: integer
        progress_percent:
          type: string
          readOnly: true
        region:
          oneOf:
          - $ref: '#/components/schemas/RegionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_urgent:
          type: boolean
        is_featured:
          type: boolean
        is_anonymous:
          type: boolean
        cover_image_url:
          type: string
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/CampaignImage'
          readOnly: true
        updates:
          type: array
          items:
            $ref: '#/components/schemas/CampaignUpdate'
          readOnly: true
        updates_count:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        category_slug:
          type: string
          readOnly: true
        owner_id:
          type: string
          readOnly: true
        owner_email:
          type: string
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        owner_phone:
          type: string
          readOnly: true
        owner_joined_at:
          type: string
          format: date-time
